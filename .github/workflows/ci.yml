name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build, perf & smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsgo --noEmit

      - name: Production build
        run: bun run build

      - name: Bundle size budget
        run: bun run perf:budget

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Smoke tests (fails on any console error)
        run: bun run test:smoke

      - name: Route performance budget
        run: bun run perf:routes

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          if-no-files-found: ignore
          path: |
            test-artifacts/**
            perf-report-bundle.json
            perf-report-routes.json
